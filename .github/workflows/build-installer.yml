name: Build installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out the source
        uses: actions/checkout@v4

      - name: Install the .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build the self-contained app
        run: dotnet publish src/WhateverITPCCare.csproj -c Release -o publish

      - name: Install Inno Setup (the installer compiler)
        run: choco install innosetup --no-progress -y

      - name: Compile the branded installer
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss'

      - name: Upload the installer as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: WhateverITPCCare-Setup
          path: Output/WhateverITPCCare-Setup.exe
          if-no-files-found: error

      - name: Attach the installer to a GitHub Release (only for v* tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Output/WhateverITPCCare-Setup.exe
