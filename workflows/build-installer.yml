# =====================================================================
#  Build the Whatever IT PC Care installer in the cloud (no cmd on your PC).
#
#  What this does, automatically, on Microsoft's Windows servers:
#    1. installs the .NET 8 SDK (fast, no antivirus to fight)
#    2. builds the self-contained app
#    3. installs Inno Setup and compiles the branded wizard installer
#    4. publishes WhateverITPCCare-Setup.exe as a DOWNLOAD you click
#
#  How you use it (one-time, all in the browser - no command line):
#    * Put this project in a GitHub repository (drag-and-drop upload works).
#    * Open the repo's "Actions" tab -> "Build installer" -> "Run workflow".
#    * When it finishes (~2-3 min), download the installer from either:
#        - the run's "Artifacts" section (WhateverITPCCare-Setup), or
#        - the "Releases" page if you pushed a version tag like v1.0.0.
#    * That WhateverITPCCare-Setup.exe is the graphical wizard you give
#      to customers. Nobody ever sees a command window.
# =====================================================================
name: Build installer

on:
  workflow_dispatch:        # lets you click "Run workflow" in the Actions tab
  push:
    tags:
      - 'v*'                # pushing a tag like v1.0.0 also makes a Release

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out the source
        uses: actions/checkout@v4

      - name: Install the .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build the self-contained app
        run: dotnet publish src/WhateverITPCCare.csproj -c Release -o publish

      - name: Install Inno Setup (the installer compiler)
        run: choco install innosetup --no-progress -y

      - name: Compile the branded installer
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss'

      - name: Upload the installer as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: WhateverITPCCare-Setup
          path: Output/WhateverITPCCare-Setup.exe
          if-no-files-found: error

      - name: Attach the installer to a GitHub Release (only for v* tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Output/WhateverITPCCare-Setup.exe
